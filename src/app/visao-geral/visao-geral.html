<section>
    <h2>Visão geral</h2>
    <ul>
        @for (total of totais; track total.area) {
        <li [ngStyle]="{ 'font-weight': total.quantidade === 0 ? 'bold' : 'normal' }">
            <app-cartao-total [area]="total.area" [quantidade]="total.quantidade"
                [ativo]="areaSelecionada() === total.area" (selecionado)="areaSelecionada.set(total.area)">
            </app-cartao-total>
        </li>
        }
    </ul>

    @if (areaSelecionada(); as area) {
    <p>Área selecionada: {{ area }}</p>
    }
</section>
